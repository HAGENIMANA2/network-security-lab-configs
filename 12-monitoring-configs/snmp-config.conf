# ============================================
# SNMP v3 Configuration
# Author: Jean de Dieu HAGENIMANA
# ============================================

# SNMP v3 User
rouser systemadmin authPriv
auth sha "auth_password_here"
priv aes "privacy_password_here"

# SNMP v3 Community for read-only access
rocommunity public

# System information
sysLocation "Data Center"
sysContact admin@example.com

# Trap destination
trap2sink 192.168.1.100 public

# Monitor disk usage
disk / 90%
disk /var 85%

# Monitor load average
load 12 10 5

# Monitor processes
proc cron
proc sshd
proc mysql
